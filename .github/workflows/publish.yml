# Publishes the Herald.OSS package to NuGet. The API key is a repository
# secret (NUGET_API_KEY); it is never stored in the repo or handled by a
# person or agent at publish time. CI reads the secret and runs the push.
#
# Set the secret once: repo Settings -> Secrets and variables -> Actions ->
# New repository secret -> name NUGET_API_KEY, value your nuget.org key.
#
# Triggers:
#   - a published GitHub Release (the normal path: cut a release, it ships)
#   - manual run (workflow_dispatch) for a release that already exists
#
# The package version comes from <Version> in Herald.OSS.csproj. --skip-
# duplicate makes a re-run safe: if that version is already on NuGet the
# push is a no-op instead of a failure.
name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Pack + push to NuGet
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack Herald.OSS.csproj --configuration Release --output ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Error "NUGET_API_KEY secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          }
          # pwsh does not expand globs for native commands, so resolve the
          # package path explicitly. Pushing the .nupkg also pushes the
          # matching .snupkg symbol package.
          $pkg = Get-ChildItem ./artifacts -Filter *.nupkg | Select-Object -First 1
          if (-not $pkg) {
            Write-Error "No .nupkg found in ./artifacts after pack."
            exit 1
          }
          dotnet nuget push $pkg.FullName `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
