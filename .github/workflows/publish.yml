# Publishes the Herald.OSS package to NuGet via TRUSTED PUBLISHING:
# nuget.org trusts this repo's publish.yml workflow directly (policy
# HERALD_NUGET_API_KEY on the mmpworks account), authenticated with
# GitHub's OIDC id-token. There is NO stored API key anywhere - nothing
# to rotate, nothing to leak. The NuGet/login action exchanges the OIDC
# token for a short-lived temp key that dies with the run.
#
# Triggers:
#   - a published GitHub Release (the normal path: cut a release, it ships)
#   - manual run (workflow_dispatch) for a release that already exists
#
# The package version comes from <Version> in Herald.OSS.csproj.
# --skip-duplicate makes a re-run safe: if that version is already on
# NuGet the push is a no-op instead of a failure.
name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for NuGet trusted publishing

jobs:
  publish:
    name: Pack + push to NuGet
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack Herald.OSS.csproj --configuration Release --output ./artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: mmpworks

      - name: Push to NuGet
        shell: pwsh
        run: |
          $pkg = Get-ChildItem ./artifacts -Filter *.nupkg | Select-Object -First 1
          if (-not $pkg) {
            Write-Error "No .nupkg found in ./artifacts after pack."
            exit 1
          }
          dotnet nuget push $pkg.FullName `
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
