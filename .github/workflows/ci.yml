name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (net8/net9/net10)
    runs-on: windows-latest
    # 3-TFM test suite needs ~25-30 min on a 2-core hosted runner;
    # 20 min killed a run whose tests were still passing at the 17-min mark.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Herald.OSS.csproj

      - name: Build (Release)
        run: dotnet build Herald.OSS.csproj --configuration Release --no-restore

      - name: Test (Release, all TFMs)
        run: dotnet test tests/Herald.OSS.Tests.csproj --configuration Release --nologo --verbosity normal

  pack:
    name: Pack NuGet (smoke)
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack Herald.OSS.csproj --configuration Release --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          retention-days: 14
