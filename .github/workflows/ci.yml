name: CI

# Every `uses:` is pinned to a full commit SHA with the version in a
# trailing comment. A tag like `@v6` is a moving pointer that whoever owns
# the action repository can repoint at any time, so a tag reference means
# trusting that repository forever rather than trusting one reviewed
# commit. Herald.OSS is public and ships packages, so it gets the same
# treatment the Herald.Sinks release workflow already uses.
#
# To update an action: read the release notes, resolve the new SHA with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (dereference once more via git/tags/<sha> if the tag is annotated),
# then change the SHA and the trailing comment together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (net8/net9/net10)
    runs-on: windows-latest
    # 3-TFM test suite needs ~25-30 min on a 2-core hosted runner;
    # 20 min killed a run whose tests were still passing at the 17-min mark.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Herald.OSS.csproj

      - name: Build (Release)
        run: dotnet build Herald.OSS.csproj --configuration Release --no-restore

      - name: Test (Release, all TFMs)
        run: dotnet test tests/Herald.OSS.Tests.csproj --configuration Release --nologo --verbosity normal

  pack:
    name: Pack NuGet (smoke)
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack Herald.OSS.csproj --configuration Release --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          retention-days: 14

      - name: Generate SBOM
        id: sbom
        uses: ./.github/actions/sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.sbom-path }}
          retention-days: 14

  codeql:
    name: CodeQL (C#)
    runs-on: windows-latest
    # Manual build mode traces a full 3-TFM Release build.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          build-mode: manual

      - name: Build (Release)
        run: dotnet build Herald.OSS.csproj --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:csharp
          output: sarif-results

      - name: Count findings
        shell: pwsh
        run: |
          $count = 0
          foreach ($file in Get-ChildItem sarif-results -Filter *.sarif) {
            $sarif = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) {
              if ($run.results) { $count += $run.results.Count }
            }
          }
          "CodeQL findings: $count" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
